name: CI

on:
  pull_request:
    branches: [main]
  # Called by release.yml on pushes to main so the image only ships after CI passes.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notinv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: make build
        run: make build
      - name: make ci
        env:
          CGO_ENABLED: 1
          NOTINV_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/notinv_test?sslmode=disable
        run: make ci
