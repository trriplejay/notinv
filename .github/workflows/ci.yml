name: CI

on:
  pull_request:
    branches: [main]
  # Called by release.yml on pushes to main so the image only ships after CI passes.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: make build
        env:
          CGO_ENABLED: 1
        run: make build
      - name: make ci
        env:
          CGO_ENABLED: 1
        run: make ci
