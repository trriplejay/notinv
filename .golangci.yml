version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # Tests build canned in-memory *http.Response values that need no closing.
      - path: _test\.go
        linters:
          - bodyclose

formatters:
  enable:
    - gofmt
    - goimports
